name: qwen3-tts
services:
  qwen3-tts:
    container_name: qwen3-tts-truenas

    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
              count: all
              driver: nvidia

    image: nvidia/cuda:12.8.0-devel-ubuntu22.04

    ports:
      - "8000:8000"

    volumes:
      - "/mnt/MEGA-Storage/Docker-tests/qwen3-tts/data:/data"

    environment:
      - HF_HOME=/data/hf
      - HF_HUB_CACHE=/data/hf
      - ATTENTION_IMPL=flash_attention_2

    entrypoint: ["/bin/bash", "-lc"]
    
    command:
      - "set -e;
         apt-get update;
         apt-get install -y --no-install-recommends
           python3 python3-pip python3-venv python3-dev
           build-essential ninja-build
           ffmpeg libsndfile1 sox git ca-certificates;
         rm -rf /var/lib/apt/lists/*;

         nvcc --version;

         python3 -m pip install -U pip setuptools wheel packaging;

         # Install a CUDA-enabled torch (needed for flash-attn to be useful).
         # If this line fails due to index/version details, see the note below.
         python3 -m pip install -U --extra-index-url https://download.pytorch.org/whl/cu128 torch;

         # Build/install FlashAttention2 (Qwen recommends --no-build-isolation)
         MAX_JOBS=4 CUDA_HOME=/usr/local/cuda python3 -m pip install -U flash-attn --no-build-isolation;

         python3 -m pip install -U qwen-tts gradio;

         python3 -c \"import torch; print('torch:', torch.__version__); print('cuda:', torch.cuda.is_available()); import flash_attn; print('flash_attn: import ok')\";

         python3 /data/app.py"